<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ask-human-to-fetch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="76" y="108" width="300" height="252" rx="28" fill="#FFFFFF"/>
  </g>
  <path d="M104 108h244a28 28 0 0 1 28 28v24H76v-24a28 28 0 0 1 28-28z" fill="#E0E7FF"/>
  <circle cx="108" cy="134" r="8" fill="#F87171"/>
  <circle cx="134" cy="134" r="8" fill="#FBBF24"/>
  <circle cx="160" cy="134" r="8" fill="#34D399"/>

  <!-- page content lines -->
  <rect x="108" y="190" width="170" height="18" rx="9" fill="#4338CA"/>
  <rect x="108" y="226" width="236" height="12" rx="6" fill="#C7D2FE"/>
  <rect x="108" y="254" width="208" height="12" rx="6" fill="#C7D2FE"/>
  <rect x="108" y="282" width="150" height="12" rx="6" fill="#C7D2FE"/>

  <!-- human badge -->
  <g filter="url(#shadow)">
    <circle cx="364" cy="352" r="84" fill="url(#badge)"/>
  </g>
  <clipPath id="badgeClip"><circle cx="364" cy="352" r="80"/></clipPath>
  <g clip-path="url(#badgeClip)" fill="#FFFFFF">
    <circle cx="364" cy="322" r="26"/>
    <ellipse cx="364" cy="420" rx="54" ry="58"/>
  </g>
  <circle cx="364" cy="352" r="84" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</svg>
